package:
  name: lightwave2d
  version: "{{ GIT_DESCRIBE_TAG }}"

source:
  path: .

build:
  number: 0
  script: |
    @echo on  # [win]
    "%PYTHON%" -m pip install . -vv --no-deps --no-build-isolation ^  # [win]
      "--config-settings=cmake.args=-GNinja" ^  # [win]
      || exit /b 1  # [win]

    export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"  # [osx]
    "${PYTHON}" -m pip install . -vv --no-deps --no-build-isolation  # [unix]

channels:
  - conda-forge
  - martinpdes

requirements:
  build:
    - {{ compiler('cxx') }}
    - vs2022_win-64  # [win]
    - ninja
    - cmake
    - llvm-openmp  # [osx]
  host:
    - python {{ PY_VER }}*
    - python_abi 3.13.* *_cp313   # [py==313]
    - scikit-build-core ~=0.3
    - pybind11 ~=2.13
    - python-build ~=1.2
    - setuptools_scm[toml] ~=8.0
    - numpy >=2.0,<3
  run:
    - python {{PY_VER}}*
    - martinpdes::mpsplots
    - martinpdes::typedunit
    - shapely ~=2.0
    - numpy ==2.2.6
    - pydantic ~=2.9.2
    - pint-pandas ~=0.6
    - pint >=0.24
    - tabulate ~=0.9

about:
  home: https://github.com/MartinPdeS/LightWave2D
  license: MIT
  summary: A package for finite-difference time domain computation for light propagation.
  description: LightWave2D is a Python package that runs 2D simulation of light propagation using FDTD.
  dev_url: https://github.com/MartinPdeS/LightWave2D
  doc_url: https://lightwave2d.readthedocs.io
  license_file: LICENSE
  keywords:
    - optics
    - scattering
    - FDTD
    - light
    - physics
    - computational optics
    - simulation

files:
  include:
    - "LightWave2D/binary/*.so"

test:
  imports:
    - LightWave2D
  requires:
    - python {{ PY_VER }}*
    - python_abi 3.13.* *_cp313   # [py==313]
    - pytest >=0.6
    - pytest-cov >=2.0
    - pytest-json-report ==1.5
    - coverage ==7.6
  commands:
    - python -m pytest
  source_files:
    - tests

extra:
  recipe-maintainers:
    - MartinPdeS
